name: Get License ALF

on:
  workflow_dispatch:

jobs:
  generate-alf:
    runs-on: ubuntu-latest
    container:
      image: unityci/editor:ubuntu-2022.3.0f1-webgl-3.0.0
    steps:
      - name: Generate Manual Activation File
        run: |
          unity-editor -batchmode -createManualActivationFile -logfile /dev/stdout || true
          mkdir -p .alf
          cp *.alf .alf/ 2>/dev/null || cp *.ilf .alf/ 2>/dev/null || true

      - name: Upload ALF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: manual-activation-file
          path: .alf/
